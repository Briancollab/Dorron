<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorrón</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">
        <h1>Dorrón</h1>

        <h2>Crea tu página web con IA</h2>

        <p>Describe la página que quieres crear.</p>

        <textarea
            id="peticion"
            placeholder="Ej: Crea una web para una tienda de zapatillas..."
        ></textarea>

        <button id="generar">Generar página 🚀</button>

        <div class="preview">
            <h3>Vista previa</h3>
            <p id="resultado">Aquí aparecerá tu página.</p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
